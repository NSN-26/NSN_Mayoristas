<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NSN Mayoristas</title>
<style>
:root{--c1:#58CF4F;--c2:#4FCF86;--c3:#4FCFC6;--c4:#D4EDD7;--tx:#1a1a1a;--gr:#666;--light:#f8f9fa;--white:#fff;--shadow:0 4px 15px rgba(88,207,79,.15)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--light);color:var(--tx);overflow-x:hidden}

/* HEADER STICKY */
.header{background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));padding:16px;box-shadow:var(--shadow);position:sticky;top:0;z-index:110}
.header-content{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 0}
.logo{width:50px;height:50px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.15));animation:float 3s ease-in-out infinite;background:#fff;border-radius:8px;padding:4px}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.header h1{color:#fff;font-size:20px;font-weight:900;margin:0}
.header p{color:rgba(255,255,255,.95);font-size:12px;margin:4px 0 0;font-weight:600}

/* TOP BAR STICKY (PROGRESS BAR) - MEJORA SOLICITADA */
.top-bar{background:#fff;padding:12px 16px;box-shadow:var(--shadow);border-bottom:3px solid var(--c1);position:sticky;top:82px;z-index:100;width:100%;display:none;align-items:center;gap:16px;justify-content:space-between;flex-wrap:nowrap;left:0;right:0}
.top-bar.show{display:flex}

.prog{flex:1;min-width:140px}
.prog-label{font-size:10px;color:var(--gr);font-weight:800;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.prog-info{display:flex;gap:4px;font-size:9px;color:var(--gr);font-weight:700}
.prog-bar-bg{height:10px;background:#e0e0e0;border-radius:10px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.1)}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));width:0%;transition:width .4s;border-radius:10px}

/* ICONO CARRITO CORREGIDO - MEJORA SOLICITADA */
.cart-info{display:flex;gap:14px;align-items:center;flex-shrink:0;white-space:nowrap}
.cart-total{font-weight:800;color:var(--c1);font-size:13px}
.cart-icon-wrapper{position:relative;display:inline-block;cursor:pointer}
.cart-icon{font-size:28px;animation:float 3s ease-in-out infinite}
.cart-badge{position:absolute;top:-8px;right:-8px;background:#FF6B6B;color:#fff;border-radius:50%;width:22px;height:22px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,0.2)}

.container{max-width:1000px;margin:0 auto;padding:16px}
.step{display:none}
.step.act{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* DISEÑO DE CARTAS Y GRID RESPONSIVO */
.cat-header{background:linear-gradient(135deg,var(--c4),rgba(212,237,215,.7));padding:24px;border-radius:14px;color:#1a1a1a;margin-bottom:28px;text-align:center;box-shadow:0 6px 24px rgba(88,207,79,.15);width:95%;max-width:500px;margin-left:auto;margin-right:auto;border:2px solid rgba(88,207,79,.2)}
.cats-wrapper{background:linear-gradient(135deg,var(--c4),rgba(212,237,215,.5));padding:28px;border-radius:14px;border:2px solid rgba(88,207,79,.2);margin-bottom:24px;box-shadow:inset 0 2px 8px rgba(88,207,79,.05),var(--shadow)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px}
.cat{border:2px solid transparent;padding:20px;border-radius:12px;text-align:center;cursor:pointer;transition:all .3s;background:#fff;box-shadow:0 2px 8px rgba(88,207,79,.1)}
.cat.sel{border-color:var(--c1);background:linear-gradient(135deg,rgba(88,207,79,.1),rgba(79,207,134,.1));box-shadow:0 0 0 3px rgba(88,207,79,.2)}
.cat-ico{font-size:36px;margin:8px 0 12px}

.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-bottom:32px}
.prod{background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);transition:all .3s;display:flex;flex-direction:column}
.prod:hover{transform:translateY(-6px);box-shadow:0 10px 30px rgba(88,207,79,.2)}
.prod-img{width:100%;aspect-ratio:1;object-fit:cover;background:#f0f0f0;display:block}
.prod-info{padding:14px;flex:1;display:flex;flex-direction:column}
.prod-nm{font-size:12px;font-weight:700;margin-bottom:8px;min-height:32px;line-height:1.3}
.prod-pr-orig{font-size:10px;color:#999;text-decoration:line-through;margin-bottom:4px}
.prod-pr{font-size:18px;font-weight:900;color:var(--c1)}
.prod-qty{display:flex;gap:6px;align-items:center;margin-top:auto}
.qty-btn{width:30px;height:30px;border:2px solid var(--c1);background:#fff;color:var(--c1);border-radius:50%;cursor:pointer;font-weight:800;display:flex;align-items:center;justify-content:center}

/* FORMULARIOS RESPONSIVOS */
.form-sec{background:#fff;padding:25px;border-radius:15px;box-shadow:var(--shadow);margin-bottom:20px;border:1px solid #e0e0e0}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
input, select{padding:12px;border:2px solid #ddd;border-radius:10px;font-size:14px;width:100%;outline:none;transition: border-color .3s}
input:focus, select:focus{border-color:var(--c1)}

.btn-main{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:15px;border:none;border-radius:12px;font-weight:900;cursor:pointer;width:100%;text-transform:uppercase;box-shadow:0 5px 15px rgba(88,207,79,0.3);transition: transform .2s}
.btn-main:active{transform:scale(0.98)}

@media(max-width:768px){
    .top-bar{top:84px;padding:10px 12px}
    .cats{grid-template-columns:repeat(2,1fr)}
    .prod-grid{grid-template-columns:repeat(2,1fr);gap:12px}
}
@media(max-width:480px){
    .top-bar{top:110px}
    .header h1{font-size:16px}
    .prog-label span:first-child{display:none}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-content">
    <img id="logo" class="logo" src="https://lh3.googleusercontent.com/d/1frQ4mETG0epjdIYu3r94mRuwqpvcD_Ff" alt="NSN">
    <div class="header-text">
      <h1>NSN Mayoristas</h1>
      <p>Catálogo Premium B2B</p>
    </div>
  </div>
</div>

<div class="top-bar" id="topBar">
  <div class="prog">
    <div class="prog-label">
      <span>Avance Inversión</span>
      <span id="progPct">0%</span>
    </div>
    <div class="prog-bar-bg"><div class="prog-bar" id="progBar"></div></div>
    <div class="prog-info">
      <span id="cartActual">$0</span> / <span id="cartMinimo">$0</span>
    </div>
  </div>
  <div class="cart-info">
    <div class="cart-total" id="cartTotal">$0.00</div>
    <div class="cart-icon-wrapper" onclick="go(4)">
      <span class="cart-icon">🛒</span>
      <div class="cart-badge" id="cartBadge" style="display:none">0</div>
    </div>
  </div>
</div>

<div class="container">
  <!-- PASO 1: LOGIN -->
  <div id="s1" class="step act">
    <div class="form-sec" style="max-width:420px;margin:50px auto;text-align:center">
      <h2 style="margin-bottom:24px">Acceso Portal</h2>
      <div style="margin-bottom:24px; text-align:left">
        <label style="font-weight:bold; color:var(--gr); font-size:12px">EMAIL CORPORATIVO</label>
        <input type="email" id="emailInp" placeholder="tu@empresa.com" autofocus>
      </div>
      <button class="btn-main" onclick="login()">Entrar al Portal →</button>
    </div>
  </div>

  <!-- PASO 2: CATEGORIAS -->
  <div id="s2" class="step">
    <div class="cat-header">
      <h2>Elige tu Lista</h2>
      <p>Los precios se ajustarán automáticamente</p>
    </div>
    <div class="cats-wrapper">
      <div class="cats" id="cats"></div>
    </div>
    <button class="btn-main" onclick="go(3)">Continuar al Catálogo →</button>
  </div>

  <!-- PASO 3: PRODUCTOS -->
  <div id="s3" class="step">
    <h2 class="cat-title" id="catTitle">Catálogo</h2>
    <input type="text" id="searchInp" placeholder="🔍 Buscar..." onkeyup="searchProds()" style="margin-bottom:20px">
    <div class="prod-grid" id="prodGrid"></div>
    <div style="margin-top:30px; display:flex; gap:10px">
      <button class="btn-main" style="background:#ccc" onclick="go(2)">Volver</button>
      <button class="btn-main" onclick="go(4)">Pagar Pedido →</button>
    </div>
  </div>

  <!-- PASO 4: FORMULARIO -->
  <div id="s4" class="step">
    <div class="form-sec">
      <h2>Datos de Entrega</h2>
      <div class="form-grid">
        <input type="text" id="nom" placeholder="Nombre">
        <input type="text" id="ape" placeholder="Apellido">
        <input type="tel" id="tel" placeholder="WhatsApp">
        <input type="text" id="cal" placeholder="Calle">
        <input type="text" id="num" placeholder="Número">
        <input type="text" id="col" placeholder="Colonia">
        <input type="text" id="mun" placeholder="Municipio">
        <select id="est"><option value="Jalisco">Jalisco</option><option value="CDMX">Ciudad de México</option></select>
        <input type="text" id="cp" placeholder="C.P.">
      </div>
    </div>
    <button class="btn-main" onclick="enviar()">Finalizar Pedido</button>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbx5KPDX-a6t1d_9REauGwgNFHa-A6OTMdiZM-x6GEvrHqHGsfKuzWclLDmeIGg0KSDr/exec';

const IMAGENES = {
  'Akkermansia':'https://drive.google.com/thumbnail?id=1w1TQx9P_VhHtra4a6fFFhCxI484T28eq&sz=w400',
  'Algae Omega 3':'https://drive.google.com/thumbnail?id=1mODPcx57-AnirPwRzNyH68fuhQgg8xgr&sz=w400',
  'B - yeast':'https://drive.google.com/thumbnail?id=1_W7eG37p9iFkNQJMzseZ2X1mczObiyVy&sz=w400',
  'Dreams':'https://drive.google.com/thumbnail?id=1fkHK9Yr1JlkPijjhVqmjeMEZhC8ZI2BI&sz=w400',
  'Creatina':'https://drive.google.com/thumbnail?id=1_i_B71sHqPVvtia-tp3pRUpJ86XrShK8&sz=w400',
  'Vinagre de Manzana':'https://drive.google.com/thumbnail?id=11ZT_XJ1g7ZQD2-M825G4vzlIiEvyiKwx&sz=w400'
  // ... (Agrega el resto de tu lista aquí igual que antes)
};

const S = {email:'', cat:'base', prod:[], carrito:{}, total:0, min:0};

function go(n){
    document.querySelectorAll('.step').forEach(s=>s.classList.remove('act'));
    document.getElementById('s'+n).classList.add('act');
    const tb = document.getElementById('topBar');
    if(n>=3) tb.classList.add('show'); else tb.classList.remove('show');
    if(n===3) loadCat();
    window.scrollTo(0,0);
}

function makeCats(){
    const cats=[{id:'base',nm:'Base',ico:'📦'},{id:'25%',nm:'25%',ico:'💡'},{id:'plata',nm:'Plata',ico:'🥈'},{id:'oro',nm:'Oro',ico:'🥇'},{id:'diamante',nm:'Diamante',ico:'💎'}];
    document.getElementById('cats').innerHTML = cats.map(c=>`<div class="cat" onclick="selCat('${c.id}')"><div class="cat-ico">${c.ico}</div><b>${c.nm}</b></div>`).join('');
}

function selCat(id){ S.cat=id; document.querySelectorAll('.cat').forEach(el=>el.classList.remove('sel')); event.currentTarget.classList.add('sel'); }

async function login(){ S.email = document.getElementById('emailInp').value; if(S.email.includes('@')) go(2); }

function loadCat(){
    const p = new URLSearchParams(); p.append('action','getCatalog'); p.append('data',JSON.stringify({categoria:S.cat}));
    fetch(API,{method:'POST',body:p}).then(r=>r.json()).then(d=>{
        S.prod=d.productos; S.min=d.minimoInversion;
        document.getElementById('cartMinimo').textContent='$'+S.min.toLocaleString();
        document.getElementById('prodGrid').innerHTML = d.productos.map(p=>`
            <div class="prod">
                <img src="${IMAGENES[p.nombre.trim()] || ''}" class="prod-img">
                <div class="prod-info">
                    <div class="prod-nm">${p.nombre}</div>
                    <div class="prod-pr-orig">$${p.precioBase.toFixed(2)}</div>
                    <div class="prod-pr">$${p.precioFinal.toFixed(2)}</div>
                    <div class="prod-qty">
                        <button class="qty-btn" onclick="addQty(${p.id},-1)">-</button>
                        <span style="font-weight:900">${S.carrito[p.id]||0}</span>
                        <button class="qty-btn" onclick="addQty(${p.id},1)">+</button>
                    </div>
                </div>
            </div>
        `).join('');
        updProg();
    });
}

function addQty(id,d){
    S.carrito[id] = (S.carrito[id]||0)+d;
    if(S.carrito[id]<=0) delete S.carrito[id];
    loadCat();
}

function updProg(){
    let tot=0; Object.entries(S.carrito).forEach(([id,q])=>{ const p=S.prod.find(x=>x.id==id); if(p) tot+=p.precioFinal*q; });
    const pct = S.min>0?Math.min((tot/S.min)*100,100):100;
    document.getElementById('progBar').style.width=pct+'%';
    document.getElementById('progPct').textContent=Math.round(pct)+'%';
    document.getElementById('cartTotal').textContent='$'+tot.toFixed(2);
    document.getElementById('cartActual').textContent='$'+Math.round(tot).toLocaleString();
    const count = Object.values(S.carrito).reduce((a,b)=>a+b,0);
    const badge = document.getElementById('cartBadge');
    badge.style.display = count>0?'flex':'none'; badge.textContent=count;
}

window.onload = makeCats;
</script>
</body>
</html>
