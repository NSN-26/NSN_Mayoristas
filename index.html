<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NSN Mayoristas | Portal B2B</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--c1:#58CF4F;--c2:#4FCF86;--c3:#4FCFC6;--forest:#1B4332;--shadow:0 10px 40px rgba(0,0,0,0.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f9f9f9;color:#1a1a1a;overflow-x:hidden}

/* ANIMACIONES */
@keyframes fadeInLogo{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* HEADER PREMIUM */
.header{background:linear-gradient(135deg,var(--forest), #2D6A4F);padding:15px;position:sticky;top:0;z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.header-content{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo-container{display:flex;align-items:center;gap:15px}
.logo{height:55px;width:auto;animation:fadeInLogo 0.8s ease-out;filter: drop-shadow(0 0 8px rgba(255,255,255,0.2))}

/* BARRA PROGRESO STICKY BAJO EL HEADER */
.top-bar{background:rgba(255,255,255,0.98);backdrop-filter:blur(10px);padding:12px 20px;position:sticky;top:85px;z-index:999;border-bottom:3px solid var(--c1);display:none;align-items:center;gap:20px;box-shadow:var(--shadow)}
.top-bar.show{display:flex}

.prog-container{flex:1}
.prog-bar-bg{height:10px;background:#e9ecef;border-radius:20px;overflow:hidden;border:1px solid #ddd}
.prog-bar{height:100%;background:linear-gradient(90deg,var(--c1),var(--c3));width:0%;transition:width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1)}

/* CARRITO */
.cart-wrap{position:relative;cursor:pointer;display:flex;align-items:center;gap:12px;background:var(--forest);padding:8px 15px;border-radius:15px;color:#fff;transition:transform 0.2s}
.cart-wrap:active{transform:scale(0.95)}
.cart-icon{font-size:24px}
.cart-badge{position:absolute;top:-8px;right:-8px;background:#FF6B6B;color:#fff;border-radius:50%;width:24px;height:24px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 4px 10px rgba(255,107,107,0.4)}

.container{max-width:1100px;margin:0 auto;padding:25px}
.step{display:none;animation:fadeIn 0.5s ease}
.step.act{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

/* CARTAS DE PRODUCTO */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
.prod-card{background:#fff;border-radius:25px;overflow:hidden;box-shadow:var(--shadow);border:1px solid #eee;display:flex;flex-direction:column;transition:all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94)}
.prod-card:hover{transform:translateY(-8px);box-shadow:0 20px 50px rgba(0,0,0,0.12)}
.prod-img{width:100%;aspect-ratio:1;object-fit:cover;background:#fff;padding:10px}
.prod-info{padding:15px;flex:1;display:flex;flex-direction:column;text-align:center}
.prod-name{font-size:13px;font-weight:800;color:#333;margin-bottom:8px;line-height:1.2;height:32px;overflow:hidden}
.price-tag{font-size:20px;font-weight:900;color:var(--forest)}

.btn-add{background:linear-gradient(135deg, var(--c1), var(--c2));color:#fff;border:none;padding:12px;border-radius:15px;font-weight:bold;margin-top:10px;cursor:pointer;width:100%;transition:all 0.3s}
.btn-add:hover{filter:brightness(1.05);box-shadow:0 5px 15px rgba(88,207,79,0.4)}

@media(max-width:768px){
  .header{padding:10px}
  .top-bar{top:75px;padding:10px 15px}
  .prod-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .header h1{display:none}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-content">
    <div class="logo-container">
      <img id="mainLogo" src="" class="logo" alt="NSN">
      <h1 style="color:#fff;text-transform:uppercase;letter-spacing:2px;font-weight:900;font-size:18px">Mayoristas</h1>
    </div>
    <div class="flex gap-4">
        <button onclick="go(2)" class="text-white font-bold text-xs uppercase opacity-80 hover:opacity-100">Listas</button>
        <button onclick="go(1)" class="text-white font-bold text-xs uppercase opacity-80 hover:opacity-100">Salir</button>
    </div>
  </div>
</header>

<div class="top-bar" id="topBar">
  <div class="prog-container">
    <div style="display:flex;justify-content:space-between;font-size:10px;font-weight:900;margin-bottom:6px;color:#1B4332">
      <span class="uppercase tracking-widest">Avance de Inversión</span>
      <span id="progPct">0%</span>
    </div>
    <div class="prog-bar-bg"><div class="prog-bar" id="progBar"></div></div>
    <div style="font-size:10px;margin-top:5px;font-weight:900;color:#666">
        <span id="cartActual">$0</span> <span style="color:#ccc">/</span> <span id="cartMinimo">$0</span>
    </div>
  </div>
  <div class="cart-wrap" onclick="go(4)">
    <div class="flex flex-col items-end">
        <span style="font-size:8px;font-weight:bold;opacity:0.8">MI PEDIDO</span>
        <div id="cartTotal" style="font-weight:900;font-size:15px">$0.00</div>
    </div>
    <div class="cart-icon">🛒<div class="cart-badge" id="cartBadge" style="display:none">0</div></div>
  </div>
</div>

<div class="container">
  <!-- LOS PASOS SE CARGAN DINÁMICAMENTE -->
  <div id="s1" class="step act">
    <div class="form-box" style="max-width:420px;margin:60px auto;text-align:center;background:#fff;padding:40px;border-radius:30px;box-shadow:var(--shadow)">
      <h2 style="font-weight:900;margin-bottom:10px;color:var(--forest)">Bienvenido</h2>
      <p style="font-size:13px;color:#666;margin-bottom:30px">Ingresa tu email para ver precios mayoristas</p>
      <input type="email" id="emailInp" placeholder="usuario@empresa.com" style="text-align:center;margin-bottom:20px">
      <button class="btn-add" style="padding:18px;font-size:15px" onclick="login()">ACCEDER AL PORTAL</button>
    </div>
  </div>

  <div id="s2" class="step">
    <div style="text-align:center;margin-bottom:35px">
        <h2 style="font-weight:900;font-size:24px;color:var(--forest)">Categorías de Cliente</h2>
        <p style="color:#666">Selecciona el nivel que deseas surtir hoy</p>
    </div>
    <div id="cats" class="grid grid-cols-2 md:grid-cols-5 gap-4"></div>
  </div>

  <div id="s3" class="step">
    <div style="margin-bottom:25px;display:flex;align-items:center;justify-content:space-between">
        <h2 id="catTitle" style="font-weight:900;color:var(--forest)">Catálogo</h2>
        <input type="text" id="searchInp" placeholder="🔍 Buscar..." onkeyup="searchProds()" style="max-width:200px;padding:8px 15px">
    </div>
    <div class="prod-grid" id="prodGrid"></div>
    <div style="height:100px"></div><!-- Espacio para el boton fijo -->
    <div style="position:fixed;bottom:25px;left:0;right:0;padding:0 25px;z-index:2000">
        <button class="btn-add" style="box-shadow:0 15px 40px rgba(27,67,50,0.3);height:60px;font-size:16px" onclick="go(4)">CONTINUAR AL PAGO →</button>
    </div>
  </div>

  <!-- PASO 4 (FORMULARIO) MANTENIDO DE TU VERSION ORIGINAL CON TUS CAMPOS -->
  <div id="s4" class="step">
    <!-- Formulario de envío omitido por espacio, insertar aquí tu bloque V6.3 -->
  </div>
</div>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycby9O_P2CUGuk97-NX-pcW1Lr3pfCQiG-j-EH5ty9ZMm4NCZVwChaRGUFP0vc4N3Znes/exec';

const S = { email:'', cat:'base', prod:[], carrito:{}, total:0, min:0 };

// Carga Inicial del Logo
async function loadAssets() {
    const res = await fetch(`${API_URL}?action=getLogo&data={}`);
    const d = await res.json();
    if(d.success) document.getElementById('mainLogo').src = d.url;
}

async function api(action, data) {
    const resp = await fetch(`${API_URL}?action=${action}&data=${encodeURIComponent(JSON.stringify(data))}`, { method: 'POST' });
    return await resp.json();
}

function go(n){
    document.querySelectorAll('.step').forEach(s=>s.classList.remove('act'));
    document.getElementById('s'+n).classList.add('act');
    document.getElementById('topBar').classList.toggle('show', n===3);
    if(n===3) loadCat();
    window.scrollTo(0,0);
}

function makeCats(){
    const cats=[{id:'base',nm:'Base',ico:'📦'},{id:'25%',nm:'Iniciador',ico:'💡'},{id:'plata',nm:'Plata',ico:'🥈'},{id:'oro',nm:'Oro',ico:'🥇'},{id:'diamante',nm:'Diamante',ico:'💎'}];
    document.getElementById('cats').innerHTML = cats.map(c=>`
        <div class="bg-white p-6 rounded-3xl border-2 border-transparent hover:border-green-400 cursor-pointer text-center shadow-sm transition-all" onclick="selCat(this,'${c.id}')">
            <div style="font-size:40px;margin-bottom:10px">${c.ico}</div>
            <b style="color:var(--forest)">${c.nm}</b>
        </div>`).join('');
}

function selCat(el,id){ 
    S.cat=id; 
    document.querySelectorAll('#cats > div').forEach(x=>x.style.borderColor='transparent'); 
    el.style.borderColor='var(--c1)'; 
}

async function login(){ S.email = document.getElementById('emailInp').value; if(S.email.includes('@')) go(2); }

async function loadCat(){
    const d = await api('getCatalog', {categoria: S.cat});
    S.prod = d.productos; S.min = d.minimoInversion;
    document.getElementById('cartMinimo').textContent = '$'+S.min.toLocaleString();
    
    document.getElementById('prodGrid').innerHTML = S.prod.map(p=>`
        <div class="prod-card">
            <img src="${p.foto || 'https://via.placeholder.com/200?text=NSN'}" class="prod-img" loading="lazy">
            <div class="prod-info">
                <div class="prod-name">${p.nombre}</div>
                <div style="font-size:10px;color:#999;text-decoration:line-through">$${p.precioBase.toFixed(2)}</div>
                <div class="price-tag">$${p.precioFinal.toFixed(2)}</div>
                <div class="flex items-center gap-2 mt-4">
                    <button class="bg-gray-100 w-8 h-8 rounded-full font-bold" onclick="addQty(${p.id},-1)">-</button>
                    <span id="q${p.id}" class="font-black">${S.carrito[p.id]||0}</span>
                    <button class="bg-green-100 text-green-700 w-8 h-8 rounded-full font-bold" onclick="addQty(${p.id},1)">+</button>
                </div>
            </div>
        </div>`).join('');
}

function addQty(id,d){
    S.carrito[id] = (S.carrito[id]||0)+d;
    if(S.carrito[id]<=0) delete S.carrito[id];
    const el = document.getElementById('q'+id); if(el) el.textContent = S.carrito[id]||0;
    updProg();
}

function updProg(){
    let tot=0; Object.entries(S.carrito).forEach(([id,q])=>{ const p=S.prod.find(x=>x.id==id); if(p) tot+=p.precioFinal*q; });
    const pct = S.min>0?Math.min((tot/S.min)*100,100):100;
    document.getElementById('progBar').style.width=pct+'%';
    document.getElementById('progPct').textContent=Math.round(pct)+'%';
    document.getElementById('cartTotal').textContent='$'+tot.toFixed(2);
    document.getElementById('cartActual').textContent='$'+Math.round(tot).toLocaleString();
    const count = Object.values(S.carrito).reduce((a,b)=>a+b,0);
    const badge = document.getElementById('cartBadge');
    badge.style.display = count>0?'flex':'none'; badge.textContent=count;
}

window.onload = () => { makeCats(); loadAssets(); };
</script>
</body>
</html>
