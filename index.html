<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NSN Mayoristas | Portal B2B</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
    --green-light: #F7FEE7;
    --green-soft: #ECFCCB;
    --green-brand: #84CC16;
    --green-btn: #A3E635;
    --mint-gradient: linear-gradient(135deg, #BEF264 0%, #65A30D 100%);
    --header-gradient: linear-gradient(135deg, #ECFCCB 0%, #D9F99D 100%);
}
body{font-family:'Inter',system-ui,sans-serif;background-color: var(--green-light);color:#374151;overflow-x:hidden}

/* ANIMACIÓN LATIDO RÁPIDO */
@keyframes heartBeatFast {
    0% { transform: scale(1); }
    15% { transform: scale(1.3); }
    30% { transform: scale(1); }
    45% { transform: scale(1.3); }
    100% { transform: scale(1); }
}
.animate-beat:hover .emoji { animation: heartBeatFast 0.5s infinite; display: inline-block; }

/* HEADER LIGHT GRADIENT */
.header{background: var(--header-gradient);padding:15px;position:sticky;top:0;z-index:1100;box-shadow:0 2px 15px rgba(0,0,0,0.05)}

/* BARRA PROGRESO STICKY BAJO HEADER */
.sticky-bar{background:rgba(255,255,255,0.85);backdrop-filter:blur(12px);padding:10px 20px;position:sticky;top:80px;z-index:1000;border-bottom:2px solid var(--green-brand);display:none;box-shadow:0 8px 30px rgba(0,0,0,0.03)}
.sticky-bar.show{display:flex;align-items:center;gap:15px}

.prog-bar-bg{height:10px;background:#e2e8f0;border-radius:20px;flex:1;overflow:hidden}
.prog-bar-fill{height:100%;background: var(--mint-gradient);width:0%;transition:width 0.5s cubic-bezier(0, 0.55, 0.45, 1)}

/* SISTEMA DE PASOS */
.step{display:none;}
.step.act{display:block; animation: fadeUp 0.4s forwards;}
@keyframes fadeUp{ from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }

/* CATEGORIAS */
.cat-card{background:#fff;border-radius:30px;padding:25px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all 0.3s;box-shadow: 0 10px 40px rgba(0,0,0,0.03)}
.cat-card:hover{transform:translateY(-5px)}
.cat-card.sel{border-color:var(--green-brand);background: var(--green-soft);transform:scale(1.03)}

/* PRODUCTOS - IMÁGENES 100% AJUSTADAS */
.prod-card{background:#fff;border-radius:28px;border:1px solid #f1f5f9;transition:all 0.3s;display:flex;flex-direction:column;overflow:hidden;height:100%}
.img-container{background:#fff; width:100%; height:220px; display:flex; align-items:center; justify-content:center; padding:15px; overflow:hidden}
.prod-img{max-width:100%; max-height:100%; object-fit:contain}

.price-base{text-decoration:line-through;color:#cbd5e1;font-size:12px;font-weight:bold}
.price-final{color:var(--green-brand);font-weight:900;font-size:22px}

.btn-back{color:var(--green-brand);font-weight:900;display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:20px;font-size:11px;text-transform:uppercase;letter-spacing:1px}

/* SIDEBAR CARRITO */
#cartSidebar{display:none;position:fixed;top:0;right:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:2100;justify-content:flex-end}
.cart-content{width:100%;max-width:380px;background:#fff;height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 50px rgba(0,0,0,0.1);animation: slideLeft 0.3s forwards;}
@keyframes slideLeft { from{transform:translateX(100%)} to{transform:translateX(0)} }

@media(max-width:768px){
    .sticky-bar{top:78px}
    .prod-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .img-container{height:180px}
}
</style>
</head>
<body>

<header class="header">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
        <img id="mainLogo" src="" class="h-[50px] drop-shadow-sm" alt="NSN">
        <div class="text-right">
            <h1 class="text-lime-900 font-black uppercase tracking-tighter text-sm sm:text-lg">Portal Mayorista</h1>
            <p class="text-lime-600 text-[9px] font-black opacity-70">SISTEMA B2B</p>
        </div>
    </div>
</header>

<div class="sticky-bar" id="topBar">
    <div class="flex-1">
        <div class="flex justify-between text-[10px] font-black text-lime-900 mb-1 uppercase tracking-widest">
            <span>Inversión</span>
            <span id="progPct">0%</span>
        </div>
        <div class="prog-bar-bg"><div class="prog-bar-fill shadow-sm" id="progBar"></div></div>
    </div>
    <div class="bg-lime-50 text-lime-700 px-4 py-2 rounded-2xl flex items-center gap-3 cursor-pointer border border-lime-200 active:scale-95 transition-all shadow-sm" onclick="toggleCart(true)">
        <div class="text-right leading-none">
            <p class="text-[8px] font-black opacity-50 uppercase">Total</p>
            <span id="cartTotal" class="font-black text-xs">$0.00</span>
        </div>
        <div class="relative">
            <span class="text-2xl">🛒</span>
            <div id="cartBadge" class="absolute -top-2 -right-2 bg-red-500 text-[9px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-white font-black text-white hidden">0</div>
        </div>
    </div>
</div>

<div class="container max-w-6xl mx-auto p-4 min-h-[60vh]">
    <!-- PASO 1: LOGIN -->
    <div id="s1" class="step act">
        <div class="max-w-md mx-auto bg-white p-10 rounded-[3.5rem] shadow-2xl text-center mt-12 border-t-8 border-lime-300">
            <h2 class="text-3xl font-black text-slate-800 mb-2">Bienvenido</h2>
            <p class="text-slate-400 text-sm mb-10 font-medium">Portal de Sincronización B2B</p>
            <input type="email" id="emailInp" placeholder="tu@empresa.com" class="w-full p-5 rounded-3xl bg-slate-50 border-2 border-transparent focus:border-lime-400 outline-none text-center font-bold mb-6 transition-all">
            <button onclick="login()" id="btnLogin" class="w-full bg-lime-500 text-white p-5 rounded-3xl font-black shadow-lg hover:bg-lime-600 transition-all uppercase tracking-widest">ENTRAR</button>
        </div>
    </div>

    <!-- PASO 2: CATEGORIAS -->
    <div id="s2" class="step">
        <div class="btn-back" onclick="go(1)">← SALIR</div>
        <div class="text-center mb-10">
            <h2 class="text-3xl font-black text-lime-950">Selecciona tu Nivel</h2>
            <p class="text-lime-600 font-bold uppercase text-[10px] mt-2">Los precios se ajustarán automáticamente</p>
        </div>
        <div id="cats" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4"></div>
        <div class="mt-12 text-center">
            <button onclick="go(3)" id="btnContinueCat" disabled class="bg-slate-200 text-slate-400 px-12 py-5 rounded-3xl font-black transition-all uppercase tracking-widest">Continuar al Catálogo →</button>
        </div>
    </div>

    <!-- PASO 3: CATALOGO -->
    <div id="s3" class="step">
        <div class="btn-back" onclick="go(2)">← EDITAR MI NIVEL</div>
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 bg-white p-6 rounded-[2.5rem] shadow-sm">
            <div>
                <h2 id="catTitle" class="text-xl font-black text-lime-950 uppercase">Catálogo</h2>
                <p id="catMinLabel" class="text-[10px] text-lime-500 font-black tracking-widest uppercase"></p>
            </div>
            <div class="relative w-full md:w-64">
                <input type="text" id="searchInp" onkeyup="searchProds()" placeholder="🔍 Buscar..." class="p-3 pl-10 rounded-2xl bg-slate-50 border-0 w-full outline-none focus:ring-2 focus:ring-lime-400 font-medium text-sm">
            </div>
        </div>
        <div class="prod-grid grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="prodGrid"></div>
        <div class="h-32"></div>
        <div class="fixed bottom-6 left-0 right-0 px-6 z-[1050]">
            <button onclick="go(4)" class="max-w-md mx-auto block w-full bg-lime-500 text-white p-5 rounded-3xl font-black shadow-2xl hover:scale-105 active:scale-95 transition-all uppercase tracking-widest">Revisar mi pedido →</button>
        </div>
    </div>

    <!-- PASO 4: FORMULARIO -->
    <div id="s4" class="step">
        <div class="btn-back" onclick="go(3)">← VOLVER AL CATÁLOGO</div>
        <div class="bg-white p-8 rounded-[3rem] shadow-2xl">
            <h2 class="text-2xl font-black mb-8 text-lime-950 uppercase text-center">Información de Envío</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="nom" placeholder="Nombre(s)" class="p-4 bg-slate-50 rounded-2xl border-0">
                <input type="text" id="ape" placeholder="Apellidos" class="p-4 bg-slate-50 rounded-2xl border-0">
                <input type="tel" id="tel" placeholder="WhatsApp" class="p-4 bg-slate-50 rounded-2xl border-0 md:col-span-2">
                <input type="text" id="cal" placeholder="Calle" class="p-4 bg-slate-50 rounded-2xl border-0">
                <input type="text" id="num" placeholder="Número" class="p-4 bg-slate-50 rounded-2xl border-0">
                <input type="text" id="col" placeholder="Colonia" class="p-4 bg-slate-50 rounded-2xl border-0 md:col-span-2">
                <input type="text" id="mun" placeholder="Municipio" class="p-4 bg-slate-50 rounded-2xl border-0">
                <input type="text" id="cp" placeholder="C.P." class="p-4 bg-slate-50 rounded-2xl border-0">
            </div>
            <button onclick="enviarPedido()" class="w-full bg-lime-600 text-white p-5 rounded-3xl font-black mt-8 shadow-xl hover:bg-black transition-all uppercase">Confirmar y Pagar</button>
        </div>
    </div>
</div>

<!-- SIDEBAR CARRITO -->
<div id="cartSidebar" onclick="toggleCart(false)">
    <div class="cart-content p-8" onclick="event.stopPropagation()">
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <h2 class="text-xl font-black text-lime-900 uppercase tracking-widest">Tu Pedido</h2>
            <button onclick="toggleCart(false)" class="text-3xl text-slate-300 hover:text-red-500 transition-colors">✕</button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto space-y-4 pr-2"></div>
        <div class="border-t-4 border-lime-50 pt-8 mt-6">
            <div class="flex justify-between items-end mb-8">
                <span class="text-xs font-black text-slate-300 uppercase tracking-widest">Monto Estimado</span>
                <span id="cartFinal" class="text-3xl font-black text-lime-900">$0.00</span>
            </div>
            <button onclick="toggleCart(false); go(4)" class="w-full bg-lime-500 text-white p-5 rounded-3xl font-black uppercase tracking-widest shadow-2xl hover:bg-black transition-all">Confirmar Datos →</button>
        </div>
    </div>
</div>

<script>
// --- URL DE TU PROYECTO REAL ---
const API_URL = 'https://script.google.com/macros/s/AKfycbwQwa12BjKDAD18hl-1m8AyRhQ7ZKiHacUe7YcP5A5XsvAcmjogSdiFZEqqp_RU1nfc/exec';

const S = { email:'', cat:'', prod:[], carrito:{}, total:0, min:0, pct:0, rawData: null };

async function api(action, data) {
    const resp = await fetch(`${API_URL}?action=${action}&data=${encodeURIComponent(JSON.stringify(data))}`, { method: 'POST' });
    return await resp.json();
}

function go(n){
    document.querySelectorAll('.step').forEach(s=>s.classList.remove('act'));
    const stepEl = document.getElementById('s'+n);
    if(stepEl) stepEl.classList.add('act');
    document.getElementById('topBar').classList.toggle('show', n>=3);
    window.scrollTo(0,0);
}

function initCats(){
    const cats=[
        {id:'Lista Base',nm:'Base',ico:'📦', info:'0% desc'},
        {id:'25%',nm:'Iniciador',ico:'💡', info:'25% desc'},
        {id:'Plata',nm:'Plata',ico:'🥈', info:'47% desc'},
        {id:'Oro',nm:'Oro',ico:'🥇', info:'52% desc'},
        {id:'Diamante',nm:'Diamante',ico:'💎', info:'57% desc'}
    ];
    
    // CORRECCIÓN toLocaleString: Verificamos si existe el dato antes de mapear
    document.getElementById('cats').innerHTML = cats.map(c=>{
        const minVal = S.rawData.mins[c.id] || 0;
        return `
        <div class="cat-card animate-beat" onclick="selCat(this, '${c.id}')">
            <span class="emoji text-5xl mb-4 block">${c.ico}</span>
            <h3 class="font-black text-lg text-lime-900">${c.nm}</h3>
            <p class="text-[10px] text-lime-500 font-black uppercase mt-1">${c.info}</p>
            <div class="mt-4 text-[9px] bg-lime-50 text-lime-600 px-3 py-1 rounded-full font-black inline-block border border-lime-100">$${minVal.toLocaleString()} min</div>
        </div>`}).join('');
}

function selCat(el, id){
    S.cat = id;
    S.pct = S.rawData.discounts[id] || 0;
    S.min = S.rawData.mins[id] || 0;
    document.querySelectorAll('.cat-card').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
    const btn = document.getElementById('btnContinueCat');
    btn.disabled = false;
    btn.className = "bg-lime-500 text-white px-12 py-5 rounded-3xl font-black shadow-xl hover:bg-black cursor-pointer transition-all uppercase tracking-widest scale-105";
    renderCatalog();
}

function renderCatalog(){
    document.getElementById('catTitle').textContent = `Nivel ${S.cat}`;
    document.getElementById('catMinLabel').textContent = `Inversión requerida: $${S.min.toLocaleString()}`;
    
    document.getElementById('prodGrid').innerHTML = S.rawData.products.map(p=>{
        const finalPrice = p.precioBase * (1 - S.pct);
        return `
        <div class="prod-card shadow-sm">
            <div class="img-container">
                <img src="${p.foto}" class="prod-img" onerror="this.src='https://via.placeholder.com/150?text=NSN'">
                ${S.pct > 0 ? `<div class="absolute top-2 right-2 bg-lime-400 text-white text-[9px] font-black px-2 py-1 rounded-lg shadow-sm">-${Math.round(S.pct*100)}%</div>`:''}
            </div>
            <div class="p-6 flex-1 flex flex-col">
                <h4 class="text-[10px] font-black text-slate-300 uppercase mb-2 leading-tight">${p.nombre}</h4>
                <div class="mb-4">
                    ${S.pct > 0 ? `<div class="price-base text-slate-300">$${p.precioBase.toFixed(2)}</div>`:''}
                    <div class="price-final text-lime-900">$${finalPrice.toFixed(2)}</div>
                </div>
                <div class="mt-auto flex items-center justify-between bg-slate-50 rounded-2xl p-1 border border-slate-100">
                    <button onclick="addQty(${p.id},-1)" class="w-10 h-10 bg-white rounded-xl shadow-sm font-black text-slate-300 active:text-red-500 transition-colors">-</button>
                    <span class="font-black text-slate-700 text-lg">${S.carrito[p.id]||0}</span>
                    <button onclick="addQty(${p.id},1)" class="w-10 h-10 bg-lime-500 text-white rounded-xl shadow-sm font-black active:scale-95 transition-transform">+</button>
                </div>
            </div>
        </div>`}).join('');
    updProg();
}

function addQty(id,d){
    S.carrito[id] = (S.carrito[id]||0)+d;
    if(S.carrito[id]<=0) delete S.carrito[id];
    renderCatalog();
    updCartUI();
}

function updProg(){
    let tot=0; 
    Object.entries(S.carrito).forEach(([id,q])=>{ 
        const p=S.rawData.products.find(x=>x.id==id); 
        if(p) tot+=(p.precioBase * (1 - S.pct))*q; 
    });
    const pct = S.min>0?Math.min((tot/S.min)*100,100):100;
    document.getElementById('progBar').style.width=pct+'%';
    document.getElementById('progPct').textContent=Math.round(pct)+'%';
    document.getElementById('cartTotal').textContent='$'+tot.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    document.getElementById('cartActual').textContent='$'+Math.round(tot).toLocaleString();
    document.getElementById('cartMinimo').textContent='$'+(S.min || 0).toLocaleString();
    document.getElementById('cartFinal').textContent='$'+tot.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    
    const count = Object.values(S.carrito).reduce((a,b)=>a+b,0);
    const badge = document.getElementById('cartBadge');
    badge.style.display = count>0?'flex':'none'; badge.textContent=count;
}

function toggleCart(show){ document.getElementById('cartSidebar').style.display=show?'flex':'none'; if(show) updCartUI(); }

function updCartUI(){
    let h='';
    Object.entries(S.carrito).forEach(([id,q])=>{
        const p=S.rawData.products.find(x=>x.id==id);
        const finalPrice = p.precioBase * (1 - S.pct);
        if(p){
            h += `
            <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-3xl border border-slate-100">
                <img src="${p.foto}" class="w-12 h-12 object-contain bg-white rounded-xl p-1">
                <div class="flex-1">
                    <p class="text-[9px] font-black uppercase text-slate-400 leading-tight">${p.nombre}</p>
                    <p class="font-black text-lime-700 text-sm">$${(finalPrice*q).toFixed(2)}</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="addQty(${id},-1)" class="w-7 h-7 bg-white rounded-lg border text-xs font-black">-</button>
                    <span class="font-black text-xs w-4 text-center">${q}</span>
                    <button onclick="addQty(${id},1)" class="w-7 h-7 bg-white rounded-lg border text-xs font-black">+</button>
                    <button onclick="addQty(${id},-${q})" class="ml-1 text-slate-300 hover:text-red-500">🗑️</button>
                </div>
            </div>`;
        }
    });
    document.getElementById('cartItems').innerHTML = h || '<div class="text-center py-20 opacity-20 font-black uppercase text-xs tracking-widest">Carrito Vacío</div>';
}

async function login(){
    const e = document.getElementById('emailInp').value;
    if(!e.includes('@')) return alert('Email inválido');
    S.email = e;
    const btn = document.getElementById('btnLogin');
    btn.disabled = true; btn.textContent = 'Sincronizando...';
    
    try {
        const d = await api('getAppData', {});
        if(d.success){
            S.rawData = d;
            document.getElementById('mainLogo').src = d.logoUrl;
            initCats();
            go(2);
        } else { alert("Error del servidor: " + d.error); btn.disabled = false; btn.textContent = 'Entrar'; }
    } catch(err) {
        alert("Fallo de conexión");
        btn.disabled = false; btn.textContent = 'Entrar';
    }
}

function searchProds(){
    const q = document.getElementById('searchInp').value.toLowerCase();
    document.querySelectorAll('.prod-card').forEach(c => {
        const nm = c.querySelector('h4').textContent.toLowerCase();
        c.style.display = nm.includes(q) ? 'flex' : 'none';
    });
}
</script>
</body>
</html>
