<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NSN Mayoristas | Portal B2B</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--c1:#58CF4F;--c2:#4FCF86;--c3:#4FCFC6;--forest:#1B4332;--shadow:0 12px 40px rgba(0,0,0,0.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f8fafc;color:#1e293b;overflow-x:hidden}

/* ANIMACIONES */
@keyframes heartBeat {
  0% { transform: scale(1); }
  14% { transform: scale(1.15); }
  28% { transform: scale(1); }
  42% { transform: scale(1.15); }
  70% { transform: scale(1); }
}
.beat:hover .cat-ico { animation: heartBeat 0.8s infinite; }

/* HEADER GRADIENT STICKY */
.header{background:linear-gradient(135deg,var(--forest), #2d6a4f);padding:15px;position:sticky;top:0;z-index:1100;box-shadow:0 4px 25px rgba(0,0,0,0.2)}
.header-content{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.logo{height:50px;width:auto;background:rgba(255,255,255,0.1);padding:5px;border-radius:12px;backdrop-filter:blur(5px)}

/* BARRA DE PROGRESO STICKY CORREGIDA */
.sticky-bar{background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);padding:12px 20px;position:sticky;top:80px;z-index:1000;border-bottom:2px solid var(--c1);display:none;box-shadow:var(--shadow)}
.sticky-bar.show{display:flex;align-items:center;gap:20px}

.prog-bar-bg{height:12px;background:#e2e8f0;border-radius:20px;overflow:hidden;flex:1;position:relative}
.prog-bar-fill{height:100%;background:linear-gradient(90deg,var(--c1),var(--c3));width:0%;transition:width 1s cubic-bezier(0.34, 1.56, 0.64, 1)}

/* CARRITO INTEGRADO PROFESIONAL */
.cart-pill{background:var(--forest);color:#fff;padding:8px 18px;border-radius:30px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.3s;position:relative}
.cart-badge{position:absolute;top:-8px;right:-2px;background:#FF6B6B;color:#fff;width:22px;height:22px;border-radius:50%;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 4px 8px rgba(0,0,0,0.2)}

.step{display:none;animation:fadeUp 0.6s ease-out}
.step.act{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* CARTAS DE CATEGORIAS */
.cat-card{background:#fff;border-radius:24px;padding:25px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all 0.3s;box-shadow:0 4px 15px rgba(0,0,0,0.05)}
.cat-card:hover{border-color:var(--c1);transform:translateY(-5px);box-shadow:var(--shadow)}
.cat-card.sel{background:linear-gradient(135deg, #f0fff4, #e6fffa);border-color:var(--c1)}
.cat-ico{font-size:48px;margin-bottom:15px;display:block}

/* PRODUCTOS */
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.prod-card{background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,0.05);display:flex;flex-direction:column;transition:all 0.4s}
.prod-card:hover{transform:translateY(-10px);box-shadow:var(--shadow)}
.prod-img{width:100%;aspect-ratio:1;object-fit:cover;padding:15px}

@media(max-width:768px){
    .header{padding:10px}
    .sticky-bar{top:70px;padding:10px 15px}
    .prod-grid{grid-template-columns:repeat(2,1fr);gap:12px}
    .header h1{font-size:14px}
}
</style>
</head>
<body>

<header class="header">
    <div class="header-content">
        <img id="mainLogo" src="" class="logo" alt="NSN">
        <div class="text-right">
            <h1 class="text-white font-black uppercase tracking-widest">Portal Mayoristas</h1>
            <p class="text-green-200 text-[10px] font-bold">NSN SMART NUTRITION</p>
        </div>
    </div>
</header>

<div class="sticky-bar" id="topBar">
    <div class="prog-container flex-1">
        <div class="flex justify-between text-[10px] font-black text-slate-500 mb-1">
            <span class="uppercase">Inversión Requerida</span>
            <span id="progPct">0%</span>
        </div>
        <div class="prog-bar-bg"><div class="prog-bar-fill" id="progBar"></div></div>
        <div class="text-[10px] font-bold mt-1 text-slate-400">
            <span id="cartActual">$0</span> / <span id="cartMinimo">$0</span>
        </div>
    </div>
    <div class="cart-pill" onclick="go(4)">
        <div class="text-right leading-none">
            <p class="text-[8px] opacity-70 font-bold">TOTAL</p>
            <span id="cartTotal" class="font-black text-sm">$0.00</span>
        </div>
        <span class="text-xl">🛒</span>
        <div class="cart-badge" id="cartBadge" style="display:none">0</div>
    </div>
</div>

<div class="container max-w-6xl mx-auto p-5">
    <!-- PASO 1: LOGIN -->
    <div id="s1" class="step act">
        <div class="max-w-md mx-auto bg-white p-10 rounded-[2.5rem] shadow-2xl text-center mt-10">
            <h2 class="text-2xl font-black mb-2 text-slate-800">Bienvenido</h2>
            <p class="text-slate-400 text-sm mb-8">Ingresa tu correo para acceder a precios B2B</p>
            <input type="email" id="emailInp" placeholder="correo@empresa.com" class="w-full p-4 rounded-2xl border-2 border-slate-100 focus:border-green-400 outline-none text-center font-bold mb-5 transition-all">
            <button onclick="login()" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white p-5 rounded-2xl font-black shadow-lg hover:shadow-green-200 transition-all">ENTRAR AL PORTAL</button>
        </div>
    </div>

    <!-- PASO 2: CATEGORIAS -->
    <div id="s2" class="step">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-black text-slate-800">Selecciona tu Lista</h2>
            <p class="text-slate-400">Los descuentos se aplicarán automáticamente</p>
        </div>
        <div id="cats" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4"></div>
        <div class="mt-10 text-center">
            <button onclick="go(3)" id="btnCatNext" disabled class="bg-slate-200 text-slate-400 px-12 py-4 rounded-2xl font-black transition-all">CONTINUAR →</button>
        </div>
    </div>

    <!-- PASO 3: CATALOGO -->
    <div id="s3" class="step">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <h2 id="catTitle" class="text-2xl font-black text-slate-800 uppercase tracking-tight">Cargando...</h2>
            <div class="relative">
                <input type="text" id="searchInp" placeholder="Buscar productos..." onkeyup="searchProds()" class="p-3 pl-10 rounded-xl border border-slate-200 w-full md:w-64 outline-none focus:ring-2 focus:ring-green-400">
                <span class="absolute left-3 top-3">🔍</span>
            </div>
        </div>
        <div class="prod-grid" id="prodGrid"></div>
        <div class="fixed bottom-6 left-0 right-0 px-6 z-[1200]">
            <button onclick="go(4)" class="max-w-md mx-auto block w-full bg-green-500 text-white p-5 rounded-2xl font-black shadow-2xl hover:bg-green-600 transition-all">REVISAR PEDIDO</button>
        </div>
    </div>
</div>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycbyEt8L7bH_fNFOZHz3LAacyrqn_5uPnrHb_oYrN0CAaZPI7Z2r46v3rw6X1JaDTvzfj/exec';

const S = { email:'', cat:'', prod:[], carrito:{}, total:0, min:0 };

async function api(action, data) {
    const resp = await fetch(`${API_URL}?action=${action}&data=${encodeURIComponent(JSON.stringify(data))}`, { method: 'POST' });
    return await resp.json();
}

function go(n){
    document.querySelectorAll('.step').forEach(s=>s.classList.remove('act'));
    document.getElementById('s'+n).classList.add('act');
    document.getElementById('topBar').classList.toggle('show', n===3);
    if(n===3) loadCat();
    window.scrollTo(0,0);
}

function makeCats(){
    const cats=[
        {id:'base',nm:'Base',ico:'📦', info:'Sin mínimo'},
        {id:'25%',nm:'Iniciador',ico:'💡', info:'$1,333 min'},
        {id:'plata',nm:'Plata',ico:'🥈', info:'$4,500 min'},
        {id:'oro',nm:'Oro',ico:'🥇', info:'$12,000 min'},
        {id:'diamante',nm:'Diamante',ico:'💎', info:'$20,000 min'}
    ];
    document.getElementById('cats').innerHTML = cats.map(c=>`
        <div class="cat-card beat group" onclick="selCat(this,'${c.id}')">
            <span class="cat-ico">${c.ico}</span>
            <h3 class="font-black text-slate-700">${c.nm}</h3>
            <p class="text-[10px] text-slate-400 uppercase font-bold mt-2">${c.info}</p>
        </div>`).join('');
}

function selCat(el,id){
    S.cat = id;
    document.querySelectorAll('.cat-card').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
    const btn = document.getElementById('btnCatNext');
    btn.disabled = false;
    btn.className = "bg-green-500 text-white px-12 py-4 rounded-2xl font-black shadow-lg hover:bg-green-600 cursor-pointer transition-all";
}

async function login(){
    const email = document.getElementById('emailInp').value;
    if(!email.includes('@')) return alert('Email inválido');
    S.email = email;
    go(2);
}

async function loadCat(){
    const catTitle = document.getElementById('catTitle');
    catTitle.textContent = "Sincronizando Precios...";
    const d = await api('getCatalog', {categoria: S.cat});
    if(!d.success) return alert(d.error);
    
    S.prod = d.productos; S.min = d.min;
    catTitle.textContent = `Lista ${S.cat} (-${d.pctAplicado}%)`;
    document.getElementById('cartMinimo').textContent = '$' + S.min.toLocaleString();
    
    document.getElementById('prodGrid').innerHTML = S.prod.map(p=>`
        <div class="prod-card group">
            <div class="relative overflow-hidden">
                <img src="${p.foto}" class="prod-img transition-transform duration-500 group-hover:scale-110" loading="lazy">
                <div class="absolute top-3 right-3 bg-white/80 backdrop-blur px-3 py-1 rounded-full text-[10px] font-black text-green-700 shadow-sm">$${p.precioFinal.toFixed(2)}</div>
            </div>
            <div class="prod-info">
                <h4 class="prod-name">${p.nombre}</h4>
                <div class="flex items-center justify-between mt-auto bg-slate-50 p-2 rounded-2xl">
                    <button onclick="addQty(${p.id},-1)" class="w-8 h-8 bg-white rounded-xl shadow-sm font-bold text-slate-400 hover:text-red-500">-</button>
                    <span id="q${p.id}" class="font-black text-slate-700">${S.carrito[p.id]||0}</span>
                    <button onclick="addQty(${p.id},1)" class="w-8 h-8 bg-white rounded-xl shadow-sm font-bold text-green-500 hover:scale-110">+</button>
                </div>
            </div>
        </div>`).join('');
    updProg();
}

function addQty(id,d){
    S.carrito[id] = (S.carrito[id]||0)+d;
    if(S.carrito[id]<=0) delete S.carrito[id];
    const el = document.getElementById('q'+id); if(el) el.textContent = S.carrito[id]||0;
    updProg();
}

function updProg(){
    let tot=0; Object.entries(S.carrito).forEach(([id,q])=>{ const p=S.prod.find(x=>x.id==id); if(p) tot+=p.precioFinal*q; });
    const pct = S.min>0?Math.min((tot/S.min)*100,100):100;
    document.getElementById('progBar').style.width=pct+'%';
    document.getElementById('progPct').textContent=Math.round(pct)+'%';
    document.getElementById('cartTotal').textContent='$'+tot.toFixed(2);
    document.getElementById('cartActual').textContent='$'+Math.round(tot).toLocaleString();
    const count = Object.values(S.carrito).reduce((a,b)=>a+b,0);
    const badge = document.getElementById('cartBadge');
    badge.style.display = count>0?'flex':'none'; badge.textContent=count;
}

async function init() {
    makeCats();
    const d = await api('getLogo', {});
    if(d.success) document.getElementById('mainLogo').src = d.url;
}

window.onload = init;
</script>
</body>
</html>
