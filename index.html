<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NSN | Mayoristas Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
    --green-light: #F0FFF4;
    --green-brand: #58CF4F;
    --green-dark: #1B4332;
    --mint: #D1FAE5;
    --gradient: linear-gradient(135deg, #58CF4F, #4FCF86, #4FCFC6);
}
body{font-family:'Inter',system-ui,sans-serif;background-color: var(--green-light);color:#1a202c;overflow-x:hidden}

/* ANIMACIONES */
@keyframes heartBeatFast {
    0% { transform: scale(1); }
    10% { transform: scale(1.2); }
    20% { transform: scale(1); }
    30% { transform: scale(1.2); }
    50% { transform: scale(1); }
}
.animate-beat:hover .emoji { animation: heartBeatFast 0.6s infinite; }

/* HEADER GRADIENT */
.header{background: var(--gradient);padding:12px 20px;position:sticky;top:0;z-index:1000;box-shadow:0 4px 20px rgba(79,207,134,0.2)}
.logo-img{height:50px;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.1));transition: transform 0.3s}
.logo-img:hover{transform:rotate(-5deg) scale(1.05)}

/* BARRA PROGRESO STICKY */
.sticky-bar{background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);padding:10px 20px;position:sticky;top:74px;z-index:900;border-bottom:2px solid var(--green-brand);display:none}
.sticky-bar.show{display:flex;align-items:center;gap:15px}

.prog-bar-bg{height:12px;background:#e2e8f0;border-radius:20px;flex:1;overflow:hidden;border:1px solid #cbd5e0}
.prog-bar-fill{height:100%;background: var(--gradient);width:0%;transition:width 0.8s cubic-bezier(0.17, 0.67, 0.83, 0.67)}

/* CARRITO POPUP */
#cartModal{display:none;position:fixed;top:0;right:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:2000;justify-content:flex-end}
.cart-card{width:100%;max-width:400px;background:#fff;height:100%;box-shadow:-10px 0 30px rgba(0,0,0,0.1);display:flex;flex-direction:column;animation:slideIn 0.3s ease-out}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}

/* STEP NAVEGACION */
.step{display:none;animation:fadeIn 0.4s ease}
.step.act{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* PRODUCT CARDS */
.prod-card{background:#fff;border-radius:24px;border:1px solid #e2e8f0;transition:all 0.3s;display:flex;flex-direction:column;overflow:hidden}
.prod-card:hover{transform:translateY(-8px);box-shadow:0 15px 35px rgba(88,207,79,0.15);border-color:var(--green-brand)}
.price-base{text-decoration:line-through;color:#a0aec0;font-size:11px}
.price-final{color:var(--green-dark);font-weight:900;font-size:18px}

.btn-back{color:var(--green-dark);font-weight:700;display:flex;align-items:center;gap:5px;cursor:pointer;margin-bottom:15px;font-size:13px}

@media(max-width:768px){
    .sticky-bar{top:74px}
    .prod-grid{grid-template-columns:repeat(2,1fr);gap:10px}
}
</style>
</head>
<body>

<header class="header">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
        <img id="mainLogo" src="" class="logo-img" alt="NSN">
        <div class="text-right">
            <h1 class="text-white font-black text-sm md:text-lg uppercase">Portal B2B</h1>
            <p class="text-green-100 text-[10px] font-bold">NSN SMART NUTRITION</p>
        </div>
    </div>
</header>

<div class="sticky-bar shadow-xl" id="topBar">
    <div class="flex-1">
        <div class="flex justify-between text-[10px] font-black text-green-800 mb-1 uppercase tracking-tighter">
            <span>Avance de Inversión</span>
            <span id="progPct">0%</span>
        </div>
        <div class="prog-bar-bg"><div class="prog-bar-fill shadow-inner" id="progBar"></div></div>
    </div>
    <div class="bg-green-800 text-white px-4 py-2 rounded-2xl flex items-center gap-3 cursor-pointer" onclick="openCart()">
        <div class="text-right leading-none">
            <p class="text-[8px] opacity-70 font-bold">MI PEDIDO</p>
            <span id="cartTotal" class="font-black text-xs">$0.00</span>
        </div>
        <div class="relative">
            <span class="text-xl">🛒</span>
            <div id="cartBadge" class="absolute -top-2 -right-2 bg-red-500 text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-white font-bold hidden">0</div>
        </div>
    </div>
</div>

<div class="container max-w-6xl mx-auto p-4">
    <!-- PASO 1: LOGIN -->
    <div id="s1" class="step act">
        <div class="max-w-md mx-auto bg-white p-8 rounded-[2.5rem] shadow-2xl text-center mt-10 border-t-8 border-green-500">
            <h2 class="text-2xl font-black text-slate-800 mb-2">Bienvenido</h2>
            <p class="text-slate-400 text-sm mb-6">Accede a tu cuenta de mayorista</p>
            <input type="email" id="emailInp" placeholder="correo@empresa.com" class="w-full p-4 rounded-2xl border-2 border-slate-100 focus:border-green-400 outline-none text-center font-bold mb-4">
            <button onclick="login()" class="w-full bg-green-500 text-white p-4 rounded-2xl font-black shadow-lg hover:bg-green-600 transition-all uppercase">Entrar</button>
        </div>
    </div>

    <!-- PASO 2: CATEGORIAS -->
    <div id="s2" class="step">
        <div class="btn-back" onclick="go(1)">← VOLVER</div>
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black text-green-900">Nivel de Descuento</h2>
            <p class="text-green-600">Selecciona tu categoría según tu inversión</p>
        </div>
        <div id="cats" class="grid grid-cols-2 lg:grid-cols-5 gap-3">
            <!-- Cargado por JS con Heartbeat Fast -->
        </div>
    </div>

    <!-- PASO 3: CATALOGO -->
    <div id="s3" class="step">
        <div class="btn-back" onclick="go(2)">← CAMBIAR LISTA</div>
        <div class="flex items-center justify-between mb-6 bg-white p-4 rounded-3xl shadow-sm">
            <h2 id="catTitle" class="font-black text-green-800 uppercase tracking-tighter">Catálogo</h2>
            <div class="relative"><input type="text" id="searchInp" onkeyup="searchProds()" placeholder="🔍 Buscar..." class="p-2 pl-8 border rounded-xl text-sm outline-none focus:border-green-400"></div>
        </div>
        <div class="prod-grid grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4" id="prodGrid"></div>
        <div class="h-32"></div>
        <div class="fixed bottom-6 left-0 right-0 px-6 z-50">
            <button onclick="go(4)" class="max-w-md mx-auto block w-full bg-green-700 text-white p-5 rounded-[2rem] font-black shadow-2xl hover:bg-green-800 transform active:scale-95 transition-all">REVISAR PEDIDO →</button>
        </div>
    </div>

    <!-- PASO 4: FORMULARIO -->
    <div id="s4" class="step">
        <div class="btn-back" onclick="go(3)">← EDITAR CARRITO</div>
        <div class="bg-white p-8 rounded-[3rem] shadow-xl">
            <h2 class="text-2xl font-black mb-6 text-green-900 uppercase">Datos de Envío</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="nom" placeholder="Nombre" class="p-4 bg-slate-50 rounded-2xl border-0">
                <input type="text" id="ape" placeholder="Apellidos" class="p-4 bg-slate-50 rounded-2xl border-0">
                <input type="tel" id="tel" placeholder="WhatsApp" class="p-4 bg-slate-50 rounded-2xl border-0 md:col-span-2">
                <input type="text" id="cal" placeholder="Calle" class="p-4 bg-slate-50 rounded-2xl border-0">
                <input type="text" id="num" placeholder="Número" class="p-4 bg-slate-50 rounded-2xl border-0">
                <input type="text" id="col" placeholder="Colonia" class="p-4 bg-slate-50 rounded-2xl border-0 md:col-span-2">
                <input type="text" id="mun" placeholder="Municipio" class="p-4 bg-slate-50 rounded-2xl border-0">
                <input type="text" id="cp" placeholder="C.P." class="p-4 bg-slate-50 rounded-2xl border-0">
            </div>
            <button onclick="enviarPedido()" class="w-full bg-green-500 text-white p-5 rounded-2xl font-black mt-8 shadow-xl hover:bg-green-600 transition-all uppercase">Finalizar Pedido</button>
        </div>
    </div>
</div>

<!-- MODAL CARRITO -->
<div id="cartModal" onclick="closeCart(event)">
    <div class="cart-card p-6" onclick="event.stopPropagation()">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-black text-green-900">Tu Carrito</h2>
            <button onclick="closeCart()" class="text-2xl opacity-30 hover:opacity-100">✕</button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto space-y-4">
            <!-- Items del carrito -->
        </div>
        <div class="border-t pt-6 mt-4">
            <div class="flex justify-between text-2xl font-black text-green-800 mb-4">
                <span>Total:</span>
                <span id="cartFinal">$0.00</span>
            </div>
            <button onclick="closeCart(); go(4)" class="w-full bg-green-700 text-white p-4 rounded-2xl font-black uppercase shadow-lg">Confirmar Dirección</button>
        </div>
    </div>
</div>

<script>

const API_URL = 'https://script.google.com/macros/s/AKfycby-Gvq2rZASpJvgblhPjGOa-Cw5Cva0D67Sot87yTl7h6m7ARutNS-WFEJVSjHERhce/exec';

const S = { email:'', cat:'', prod:[], carrito:{}, total:0, min:0, pct:0 };

async function api(action, data) {
    const resp = await fetch(`${API_URL}?action=${action}&data=${encodeURIComponent(JSON.stringify(data))}`, { method: 'POST' });
    return await resp.json();
}

function go(n){
    document.querySelectorAll('.step').forEach(s=>s.classList.remove('act'));
    document.getElementById('s'+n).classList.add('act');
    document.getElementById('topBar').classList.toggle('show', n>=3);
    if(n===3) renderCatalog();
    window.scrollTo(0,0);
}

function initCats(){
    const cats=[
        {id:'base',nm:'Base',ico:'📦', info:'0% desc'},
        {id:'25%',nm:'Iniciador',ico:'💡', info:'25% desc'},
        {id:'plata',nm:'Plata',ico:'🥈', info:'47% desc'},
        {id:'oro',nm:'Oro',ico:'🥇', info:'52% desc'},
        {id:'diamante',nm:'Diamante',ico:'💎', info:'57% desc'}
    ];
    document.getElementById('cats').innerHTML = cats.map(c=>`
        <div class="cat-card animate-beat cursor-pointer" onclick="selCat('${c.id}')">
            <span class="emoji text-5xl mb-4 block">${c.ico}</span>
            <h3 class="font-black text-green-900">${c.nm}</h3>
            <p class="text-[10px] text-green-600 font-bold uppercase mt-1">${c.info}</p>
        </div>`).join('');
}

async function selCat(id){
    S.cat = id;
    const d = await api('getCatalog', {categoria: S.cat});
    if(d.success){
        S.prod = d.productos; S.min = d.min; S.pct = d.pct;
        go(3);
    }
}

function renderCatalog(){
    document.getElementById('catTitle').textContent = `Lista ${S.cat} (-${S.pct}%)`;
    document.getElementById('cartMinimo').textContent = '$'+S.min.toLocaleString();
    document.getElementById('prodGrid').innerHTML = S.prod.map(p=>`
        <div class="prod-card">
            <img src="${p.foto}" class="prod-img h-48 w-full object-contain p-4" onerror="this.src='https://via.placeholder.com/150?text=NSN'">
            <div class="p-4 flex-1 flex flex-col">
                <h4 class="text-[11px] font-bold text-slate-500 uppercase h-8 overflow-hidden">${p.nombre}</h4>
                <div class="mt-2">
                    <div class="price-base">$${p.precioBase.toFixed(2)}</div>
                    <div class="price-final">$${p.precioFinal.toFixed(2)}</div>
                </div>
                <div class="mt-4 flex items-center justify-between bg-green-50 rounded-xl p-1">
                    <button onclick="addQty(${p.id},-1)" class="w-8 h-8 bg-white rounded-lg font-bold text-green-800 shadow-sm">-</button>
                    <span class="font-black text-green-900">${S.carrito[p.id]||0}</span>
                    <button onclick="addQty(${p.id},1)" class="w-8 h-8 bg-green-500 text-white rounded-lg font-bold shadow-sm">+</button>
                </div>
            </div>
        </div>`).join('');
    updProg();
}

function addQty(id,d){
    S.carrito[id] = (S.carrito[id]||0)+d;
    if(S.carrito[id]<=0) delete S.carrito[id];
    renderCatalog();
    updCartUI();
}

function updProg(){
    let tot=0; Object.entries(S.carrito).forEach(([id,q])=>{ const p=S.prod.find(x=>x.id==id); if(p) tot+=p.precioFinal*q; });
    const pct = S.min>0?Math.min((tot/S.min)*100,100):100;
    document.getElementById('progBar').style.width=pct+'%';
    document.getElementById('progPct').textContent=Math.round(pct)+'%';
    document.getElementById('cartTotal').textContent='$'+tot.toFixed(2);
    document.getElementById('cartActual').textContent='$'+Math.round(tot).toLocaleString();
    document.getElementById('cartFinal').textContent='$'+tot.toFixed(2);
    
    const count = Object.values(S.carrito).reduce((a,b)=>a+b,0);
    const badge = document.getElementById('cartBadge');
    badge.style.display = count>0?'flex':'none'; badge.textContent=count;
}

function openCart(){ document.getElementById('cartModal').style.display='flex'; updCartUI(); }
function closeCart(e){ if(!e || e.target.id === 'cartModal') document.getElementById('cartModal').style.display='none'; }

function updCartUI(){
    let h=''; let tot=0;
    Object.entries(S.carrito).forEach(([id,q])=>{
        const p=S.prod.find(x=>x.id==id);
        if(p){
            tot += p.precioFinal*q;
            h += `
            <div class="flex items-center gap-4 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                <img src="${p.foto}" class="w-12 h-12 object-contain bg-white rounded-lg">
                <div class="flex-1">
                    <p class="text-[10px] font-bold uppercase text-slate-600 leading-tight">${p.nombre}</p>
                    <p class="font-black text-green-700 text-sm">$${(p.precioFinal*q).toFixed(2)}</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="addQty(${id},-1)" class="w-6 h-6 bg-white rounded-full border text-xs">-</button>
                    <span class="font-bold text-xs">${q}</span>
                    <button onclick="addQty(${id},1)" class="w-6 h-6 bg-white rounded-full border text-xs">+</button>
                    <button onclick="addQty(${id},-${q})" class="ml-2 text-red-400">🗑️</button>
                </div>
            </div>`;
        }
    });
    document.getElementById('cartItems').innerHTML = h || '<p class="text-center py-10 opacity-30">Carrito vacío</p>';
}

async function login(){
    const e = document.getElementById('emailInp').value;
    if(!e.includes('@')) return alert('Ingresa un correo válido');
    S.email = e;
    const l = await api('getLogo', {});
    if(l.success) document.getElementById('mainLogo').src = l.url;
    go(2);
}

window.onload = () => { initCats(); };
</script>
</body>
</html>
